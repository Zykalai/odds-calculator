<div class="container">
  <h1>管理员后台</h1>
  <div class="subtitle">给用户充值 / 查看用户列表</div>

  <div class="form-group">
    <label>管理员密码</label>
    <input type="password" id="adminPassword" placeholder="请输入管理员密码" value="admin888">
  </div>

  <div class="form-group">
    <label>金额（元）</label>
    <input type="number" id="amount" placeholder="请输入金额" min="1" step="1">
  </div>

  <div class="btn-row">
    <button class="btn" onclick="doRecharge()">确认充值</button>
    <button class="btn btn-deduct" onclick="doDeduct()">确认扣款</button>
  </div>
  <button class="btn btn-clear" onclick="doClearBalance()">清空该用户余额</button>
  <button class="btn btn-secondary" onclick="loadUsers()">查看所有用户</button>

  <div class="result" id="result"></div>

  <div class="user-list" id="userList" style="display:none;">
    <div class="user-list-header">
      <h3>用户列表</h3>
      <button class="refresh-btn" onclick="loadUsers()">刷新</button>
    </div>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索用户名..." oninput="filterUsers()">
    <div id="userListContent"></div>
  </div>
</div>

<script>
var allUsers = [];
var selectedUser = '';

// 最长公共子序列（LCS）- DP计算长度 + 从左往右选择最靠左的匹配位置
// 既保证最长匹配，又保证标橙位置尽可能靠左
function lcs(keyword, username) {
  const m = keyword.length;
  const n = username.length;
  if (m === 0 || n === 0) return { length: 0, positions: [] };
  
  // 1. 反向构建DP表：dp[i][j] = keyword[i..] 和 username[j..] 的LCS长度
  const dp = [];
  for (let i = 0; i <= m; i++) {
    dp.push(new Array(n + 1).fill(0));
  }
  for (let i = m - 1; i >= 0; i--) {
    for (let j = n - 1; j >= 0; j--) {
      if (keyword[i] === username[j]) {
        dp[i][j] = dp[i+1][j+1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i+1][j], dp[i][j+1]);
      }
    }
  }
  
  // 2. 从左往右找最靠左的LCS匹配位置
  const L = dp[0][0]; // 最长公共子序列长度
  const positions = [];
  let lastIdx = -1;
  let remaining = L; // 还需要匹配多少个字符
  
  // 遍历关键词的每个字符，找不到满足条件的位置就跳过该字符
  for (let i = 0; i < m && remaining > 0; i++) {
    for (let j = lastIdx + 1; j < n; j++) {
      // 选择这个位置后，总匹配 = 1 + 后面还能匹配的长度
      // 等于remaining说明这个位置是最优解的一部分
      if (keyword[i] === username[j] && 1 + dp[i+1][j+1] === remaining) {
        positions.push(j);
        lastIdx = j;
        remaining--;
        break;
      }
    }
  }
  
  return { length: positions.length, positions };
}

// 计算字符串匹配度（LCS最长公共子序列）
function calcMatch(str, keyword) {
  if (!keyword) return { score: 999, positions: [] };
  const k = keyword.toLowerCase();
  const s = str.toLowerCase();
  const result = lcs(k, s);
  return { score: result.length, positions: result.positions };
}

// 高亮匹配字符
function highlightMatch(username, positions) {
  if (!positions || positions.length === 0) return username;
  var result = '';
  for (var i = 0; i < username.length; i++) {
    if (positions.indexOf(i) !== -1) {
      result += '<span style="color:#ff5000;font-weight:700;">' + username[i] + '</span>';
    } else {
      result += username[i];
    }
  }
  return result;
}

// 渲染用户列表（带搜索排序和高亮）
function renderUserList(users, keyword) {
  const contentEl = document.getElementById('userListContent');
  
  // 生成用户项HTML
  function userItemHTML(u, positions, isSelected) {
    const nameHTML = positions && positions.length > 0 ? highlightMatch(u.username, positions) : u.username;
    const btnClass = isSelected ? 'copy-btn selected' : 'copy-btn';
    const btnText = isSelected ? '已选中' : '选择';
    return `<div class="user-item" onclick="selectUser('${u.username}')">
      <div class="user-name-wrap">
        <span class="user-name">${nameHTML}</span>
        <span class="user-pwd">密码：${u.password}</span>
        <button class="${btnClass}">${btnText}</button>
      </div>
      <div class="user-right">
        <span class="user-balance">¥${u.balance.toFixed(2)}</span>
        <button class="delete-btn" onclick="event.stopPropagation(); deleteUser('${u.username}')">删除</button>
      </div>
    </div>`;
  }
  
  if (!keyword) {
    if (users.length === 0) {
      contentEl.innerHTML = '<div style="color:#999;font-size:13px;padding:10px 0;">暂无用户</div>';
      return;
    }
    // 选中的用户排最前面
    const selected = users.filter(u => u.username === selectedUser);
    const others = users.filter(u => u.username !== selectedUser);
    const sorted = [...selected, ...others];
    contentEl.innerHTML = sorted.map(u => userItemHTML(u, null, u.username === selectedUser)).join('');
    return;
  }
  
  // 计算匹配度并排序：选中的永远最前（即使匹配度为0），然后匹配数高的在前，匹配数一样时短的在前
  var matched = users.map(u => {
    var m = calcMatch(u.username, keyword);
    return { user: u, score: m.score, positions: m.positions };
  }).filter(item => item.score > 0 || item.user.username === selectedUser)
    .sort((a, b) => {
      // 选中的永远最前
      if (a.user.username === selectedUser) return -1;
      if (b.user.username === selectedUser) return 1;
      if (b.score !== a.score) return b.score - a.score;
      return a.user.username.length - b.user.username.length;
    });
  
  if (matched.length === 0) {
    // 搜索无结果，但如果有选中用户，显示选中用户
    if (selectedUser) {
      const sel = users.find(u => u.username === selectedUser);
      if (sel) {
        contentEl.innerHTML = userItemHTML(sel, null, true);
        return;
      }
    }
    contentEl.innerHTML = '<div style="color:#999;font-size:13px;padding:10px 0;">无匹配用户</div>';
    return;
  }
  
  contentEl.innerHTML = matched.map(item => 
    userItemHTML(item.user, item.positions, item.user.username === selectedUser)
  ).join('');
}

// 选择账号（切换选中状态）
function selectUser(username) {
  if (selectedUser === username) {
    // 取消选择
    selectedUser = '';
  } else {
    // 选中
    selectedUser = username;
  }
  const keyword = document.getElementById('searchInput').value.trim();
  renderUserList(allUsers, keyword);
}

// 搜索过滤用户
function filterUsers() {
  const keyword = document.getElementById('searchInput').value.trim();
  renderUserList(allUsers, keyword);
}

// 删除用户
var pendingDeleteUser = '';
function deleteUser(username) {
  pendingDeleteUser = username;
  document.getElementById('deleteConfirmMessage').textContent = '确定要删除用户 ' + username + ' 吗？此操作不可恢复！';
  document.getElementById('deletePasswordInput').value = '';
  document.getElementById('deleteConfirmModal').classList.add('active');
  setTimeout(function() { document.getElementById('deletePasswordInput').focus(); }, 100);
}

async function doDeleteUser(username, adminPassword) {
  if (!adminPassword) { showAdminAlert('请输入管理员密码'); return; }
  
  try {
    const res = await fetch('/api/admin/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_password: adminPassword, username })
    });
    const data = await res.json();
    if (res.ok) {
      showAdminAlert(data.message);
      // 如果删除的是当前选中的用户，清除选中
      if (selectedUser === username) selectedUser = '';
      loadUsers();
    } else {
      showAdminAlert(data.error || '删除失败');
    }
  } catch (e) {
    showAdminAlert('网络错误：' + e.message);
  }
}

// 程序内提示弹窗
function showAdminAlert(message) {
  document.getElementById('adminAlertMessage').textContent = message;
  document.getElementById('adminAlertModal').classList.add('active');
}
function hideAdminAlert() {
  document.getElementById('adminAlertModal').classList.remove('active');
}

// 自定义确认弹窗
function showAdminConfirm(message, callback) {
  document.getElementById('adminConfirmMessage').textContent = message;
  document.getElementById('adminConfirmModal').classList.add('active');
  deleteCallback = callback;
}
function hideAdminConfirm() {
  document.getElementById('adminConfirmModal').classList.remove('active');
  deleteCallback = null;
}

// 显示/隐藏清除按钮
function toggleClearBtn() {
  var input = document.getElementById('username');
  var btn = document.getElementById('clearUsernameBtn');
  btn.style.display = input.value ? 'flex' : 'none';
}

// 清除用户名
function clearUsername() {
  document.getElementById('username').value = '';
  document.getElementById('clearUsernameBtn').style.display = 'none';
  document.getElementById('username').focus();
}

async function doRecharge() {
  const adminPassword = document.getElementById('adminPassword').value;
  const username = selectedUser;
  const amount = parseFloat(document.getElementById('amount').value);
  const resultEl = document.getElementById('result');

  if (!adminPassword || !username || !amount || amount <= 0) {
    resultEl.className = 'result error';
    resultEl.textContent = '请先选择用户并填写金额';
    return;
  }

  try {
    const res = await fetch('/api/admin/recharge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_password: adminPassword, username, amount })
    });
    const data = await res.json();
    
    if (res.ok) {
      resultEl.className = 'result success';
      resultEl.textContent = data.message;
      document.getElementById('amount').value = '';
      loadUsers(); // 自动刷新用户列表
    } else {

async function doDeduct() {
  const adminPassword = document.getElementById('adminPassword').value;
  const username = selectedUser;

  if (!adminPassword || !username || !amount || amount <= 0) {
    resultEl.className = 'result error';
    resultEl.textContent = '请先选择用户并填写金额';

  }

  try {
    const res = await fetch('/api/admin/deduct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_password: adminPassword, username, amount })

    const data = await res.json();

    } else {

      resultEl.textContent = data.error || '扣款失败';
    }
  } catch (e) {
    resultEl.className = 'result error';
    resultEl.textContent = '网络错误：' + e.message;
  }
}

async function loadUsers(silent) {
  const adminPassword = document.getElementById('adminPassword').value;
  if (!adminPassword) {
    if (!silent) showAdminAlert('请先输入管理员密码');
    return;
  }

  try {
    const res = await fetch('/api/admin/users?admin_password=' + encodeURIComponent(adminPassword));
    const data = await res.json();
    
    if (res.ok) {
      const listEl = document.getElementById('userList');
      listEl.style.display = 'block';
      allUsers = data.users;
      // 刷新后保持搜索状态
      const keyword = document.getElementById('searchInput').value.trim();
      renderUserList(allUsers, keyword);
    } else {
      if (!silent) showAdminAlert(data.error || '获取失败');
    }
  } catch (e) {
    if (!silent) showAdminAlert('网络错误：' + e.message);
  }
}

// 自动刷新用户列表（每2秒静默更新一次）
setInterval(function() {

  if (listEl && listEl.style.display === 'block') {
    loadUsers(true);
  }
}, 2000);

function copyText(text, btn) {
  if (!text) return false;
  
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function() {
      if (btn) showCopySuccess(btn);
    }).catch(function() {
      fallbackCopy(text, btn);
    });
    return true;
  }
  
  fallbackCopy(text, btn);
  return true;
}

function fallbackCopy(text, btn) {
  var textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.top = '0';
  textarea.style.left = '0';
  textarea.style.width = '2em';
  textarea.style.height = '2em';
  textarea.style.padding = '0';
  textarea.style.border = 'none';
  textarea.style.outline = 'none';
  textarea.style.boxShadow = 'none';
  textarea.style.background = 'transparent';
  textarea.style.opacity = '0';
  textarea.style.zIndex = '-1';
  textarea.setAttribute('readonly', '');
  document.body.appendChild(textarea);
  textarea.select();
  textarea.setSelectionRange(0, text.length);
  
  try {
    document.execCommand('copy');
    if (btn) showCopySuccess(btn);
  } catch(e) {
    prompt('请长按复制以下内容：', text);
  }
  
  document.body.removeChild(textarea);
}

function showCopySuccess(btn) {
  var originalText = btn.textContent;
  btn.textContent = '已复制';
  btn.classList.add('copied');
  setTimeout(function() {
    btn.textContent = originalText;
    btn.classList.remove('copied');
  }, 1500);
}

function copyUsername(username, btn) {
  copyText(username, btn);
}
